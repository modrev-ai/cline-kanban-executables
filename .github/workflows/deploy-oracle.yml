name: Deploy to Oracle Compute

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options:
          - production
        default: 'production'
      force:
        description: 'Force deployment even if no changes'
        type: boolean
        default: false
        required: false

jobs:
  validate-yaml:
    name: Validate YAML Syntax
    uses: ./.github/workflows/validate-yaml.yml

  deploy:
    name: Deploy to Oracle Compute
    runs-on: windows-latest
    environment: ${{ github.event.inputs.environment }}
    timeout-minutes: 30
    needs: validate-yaml

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p $env:USERPROFILE\.ssh
          # Use PowerShell to properly decode base64 - remove any whitespace/newlines from secret
          # Also remove any non-base64 characters that might have been introduced
          # Use the environment variable ORACLE_SSH_KEY which is set from secrets.ORACLE_SSH_KEY_B64
          $key = $env:ORACLE_SSH_KEY
          $key = $key -replace '[\r\n\s]', ''  # Remove all whitespace including newlines, tabs, spaces
          $key = $key -replace '[^A-Za-z0-9+/=]', ''  # Remove any non-base64 characters
          try {
            $bytes = [System.Convert]::FromBase64String($key)
            $keyPath = "$env:USERPROFILE\.ssh\oracle_key"
            [System.IO.File]::WriteAllBytes($keyPath, $bytes)
            # Set proper permissions (read-only for current user) - use icacls with explicit username
            $currentUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            # Handle potential issues with username format (e.g., "DOMAIN\user" or "user@domain")
            $safeUser = $currentUser -replace '[\\/]', '_'
            try {
              icacls $keyPath /inheritance:r /grant:r "$safeUser:R" 2>$null
            } catch {
              Write-Host "Warning: Could not set file permissions via icacls, continuing anyway"
            }
            # Add host to known_hosts with longer timeout to prevent hanging
            Write-Host "Running ssh-keyscan for ${{ env.ORACLE_HOST }}..."
            ssh-keyscan -H -T 30 ${{ env.ORACLE_HOST }} >> $env:USERPROFILE\.ssh\known_hosts 2>$null || Write-Host "Warning: ssh-keyscan timed out or failed, will use StrictHostKeyChecking=no"
            Write-Host "SSH key setup successful"
          } catch {
            Write-Error "Failed to decode SSH key: $_"
            Write-Host "Key length after cleaning: $($key.Length)"
            Write-Host "Key preview (first 50 chars): $($key.Substring(0, [Math]::Min(50, $key.Length)))"
            exit 1
          }
        shell: pwsh

      - name: Test SSH connection
        run: |
          ssh -i $env:USERPROFILE\.ssh\oracle_key -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "echo 'SSH connection successful'"

      - name: Create deploy directory on Oracle
        run: |
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "mkdir -p ${{ env.DEPLOY_PATH }}/prod_executable"

      - name: Deploy prod_executable files via SCP
        run: |
          scp -i $env:USERPROFILE\.ssh\oracle_key -r prod_executable/* ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:${{ env.DEPLOY_PATH }}/prod_executable/
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "chmod +x ${{ env.DEPLOY_PATH }}/prod_executable/cline-remote-launch.sh"

      - name: Deploy start scripts via SCP
        run: |
          scp -i $env:USERPROFILE\.ssh\oracle_key start-all.bat start-all.ps1 start-all-with-tailscale.bat start-all-with-tailscale.ps1 ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Deploy README
        run: |
          scp -i $env:USERPROFILE\.ssh\oracle_key README.md ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Install Node.js and dependencies on Oracle
        run: |
          # Write bash script locally and SCP it to avoid heredoc issues
          $scriptLines = @(
            '#!/bin/bash',
            '# Add swap space to prevent OOM kills on free tier instances (increase to 4GB)',
            'if [ ! -f /swapfile ]; then',
            '  sudo fallocate -l 4G /swapfile',
            '  sudo chmod 600 /swapfile',
            '  sudo mkswap /swapfile',
            '  sudo swapon /swapfile',
            '  echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab',
            'else',
            '  # Resize existing swapfile if too small',
            '  CURRENT_SIZE=$(stat -c%s /swapfile 2>/dev/null || echo 0)',
            '  if [ "$CURRENT_SIZE" -lt 4294967296 ]; then',
            '    sudo swapoff /swapfile',
            '    sudo fallocate -l 4G /swapfile',
            '    sudo chmod 600 /swapfile',
            '    sudo mkswap /swapfile',
            '    sudo swapon /swapfile',
            '  fi',
            'fi',
            '# Install Node.js using binary tarball (much less memory than dnf)',
            'if ! command -v node &> /dev/null; then',
            '  NODE_VERSION="22.14.0"',
            '  ARCH="linux-x64"',
            '  cd /tmp',
            '  curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-${ARCH}.tar.xz" -o node.tar.xz',
            '  tar -xf node.tar.xz',
            '  sudo cp -r node-v${NODE_VERSION}-${ARCH}/bin/* /usr/local/bin/',
            '  sudo cp -r node-v${NODE_VERSION}-${ARCH}/lib/* /usr/local/lib/',
            '  sudo cp -r node-v${NODE_VERSION}-${ARCH}/include/* /usr/local/include/',
            '  sudo cp -r node-v${NODE_VERSION}-${ARCH}/share/* /usr/local/share/',
            '  rm -rf node-v${NODE_VERSION}-${ARCH} node.tar.xz',
            'fi',
            '# Install git (required for npm install from git repo)',
            'if ! command -v git &> /dev/null; then',
            '  sudo dnf install -y git',
            'fi',
            '# Create symlinks in /usr/bin for systemd services',
            'sudo ln -sf /usr/local/bin/node /usr/bin/node',
            'sudo ln -sf /usr/local/bin/npm /usr/bin/npm',
            '# Use full paths for all node/npm commands to avoid PATH issues',
            '# Configure npm for low memory usage',
            'sudo /usr/local/bin/npm config set prefer-offline true',
            'sudo /usr/local/bin/npm config set audit false',
            'sudo /usr/local/bin/npm config set fund false',
            'sudo /usr/local/bin/npm config set maxsockets 1',
            '# Configure git to use HTTPS instead of SSH for GitHub URLs',
            'sudo git config --global url."https://github.com/".insteadOf "git@github.com:"',
            'sudo git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"',
            '# Install http-proxy globally for kanban-proxy.js (use full path for sudo)',
            'sudo /usr/local/bin/npm install -g http-proxy --omit=optional --maxsockets=1 2>&1',
            '# Get latest cline release from modrev-ai/cline using Python (more reliable than grep in PowerShell)',
            'CLINE_VERSION=$(python3 -c "import urllib.request, json; data = json.load(urllib.request.urlopen(\"https://api.github.com/repos/modrev-ai/cline/releases/latest\")); print(data[\"tag_name\"])")',
            'echo "Latest cline version: $CLINE_VERSION"',
            '# Install cline globally from modrev-ai/cline release',
            'sudo /usr/local/bin/npm install -g "https://github.com/modrev-ai/cline/archive/refs/tags/${CLINE_VERSION}.tar.gz" --omit=optional --maxsockets=1 2>&1',
            '# Create symlink for cline in /usr/bin',
            'sudo ln -sf /usr/local/bin/cline /usr/bin/cline',
            '# Verify installation using full paths',
            '/usr/local/bin/node --version',
            '/usr/local/bin/npm --version',
            '/usr/local/bin/cline --version || (echo "cline not found, checking npm global bin:" && ls -la /usr/local/bin/ | grep cline || true)'
          )
          $scriptContent = ($scriptLines -join "`n") -replace "`r`n", "`n" -replace "`r", "`n"
          $scriptContent | Set-Content -Path "install-node.sh" -Encoding UTF8NoBOM -NoNewline
          scp -i $env:USERPROFILE\.ssh\oracle_key install-node.sh ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/install-node.sh
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "chmod +x /tmp/install-node.sh && /tmp/install-node.sh"
          Remove-Item install-node.sh
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Create kanban-proxy systemd service file locally
        run: |
          $serviceContent = @"
          [Unit]
          Description=Kanban Header Rewriting Proxy
          After=network.target
          
          [Service]
          Type=simple
          User=opc
          WorkingDirectory=${{ env.DEPLOY_PATH }}/prod_executable
          Environment=NODE_PATH=/home/opc/.npm-global/lib/node_modules:/usr/local/lib/node_modules
          ExecStart=/usr/bin/node kanban-proxy.js
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target
          "@
          $serviceContent | Set-Content -Path "kanban-proxy.service" -Encoding UTF8NoBOM -NoNewline
        shell: pwsh

      - name: Create kanban-server systemd service file locally
        run: |
          $serviceContent = @"
          [Unit]
          Description=Kanban Server (Cline)
          After=network.target
          
          [Service]
          Type=simple
          User=opc
          WorkingDirectory=${{ env.DEPLOY_PATH }}
          Environment=KANBAN_RUNTIME_HOST=0.0.0.0
          Environment=KANBAN_RUNTIME_PORT=3485
          Environment=NODE_ENV=production
          ExecStart=/usr/bin/cline kanban
          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target
          "@
          $serviceContent | Set-Content -Path "kanban-server.service" -Encoding UTF8NoBOM -NoNewline
        shell: pwsh

      - name: Deploy systemd service files via SCP
        run: |
          scp -i $env:USERPROFILE\.ssh\oracle_key kanban-proxy.service kanban-server.service ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "sudo mv /tmp/kanban-proxy.service /etc/systemd/system/ && sudo mv /tmp/kanban-server.service /etc/systemd/system/"

      - name: Configure firewall on Oracle
        run: |
          # Write bash script locally and SCP it to avoid heredoc issues
          $scriptLines = @(
            '#!/bin/bash',
            '# Configure firewalld to allow Kanban ports',
            'if systemctl is-active --quiet firewalld; then',
            '  sudo firewall-cmd --permanent --add-port=3484/tcp',
            '  sudo firewall-cmd --permanent --add-port=3485/tcp',
            '  sudo firewall-cmd --reload',
            '  echo "firewalld configured successfully"',
            'else',
            '  echo "firewalld not running, using iptables"',
            'fi',
            '# Also configure iptables as fallback (works regardless of firewalld)',
            'sudo iptables -I INPUT -p tcp --dport 3484 -j ACCEPT 2>/dev/null || true',
            'sudo iptables -I INPUT -p tcp --dport 3485 -j ACCEPT 2>/dev/null || true',
            '# Save iptables rules',
            'sudo mkdir -p /etc/iptables',
            'sudo iptables-save | sudo tee /etc/iptables/rules.v4 >/dev/null 2>&1 || true',
            '# Verify ports are open',
            'echo "=== Checking iptables rules ==="',
            'sudo iptables -L INPUT -n | grep -E "3484|3485" || echo "No iptables rules found for ports 3484/3485"',
            'echo "Firewall configuration complete"'
          )
          $scriptContent = ($scriptLines -join "`n") -replace "`r`n", "`n" -replace "`r", "`n"
          $scriptContent | Set-Content -Path "configure-firewall.sh" -Encoding UTF8NoBOM -NoNewline
          scp -i $env:USERPROFILE\.ssh\oracle_key configure-firewall.sh ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/configure-firewall.sh
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "chmod +x /tmp/configure-firewall.sh && /tmp/configure-firewall.sh"
          Remove-Item configure-firewall.sh
        shell: pwsh

      - name: Reload systemd and enable services
        run: |
          # Write bash script locally and SCP it to avoid heredoc issues
          $scriptLines = @(
            '#!/bin/bash',
            'sudo systemctl daemon-reload',
            'sudo systemctl enable kanban-proxy kanban-server',
            'sudo systemctl restart kanban-proxy kanban-server'
          )
          $scriptContent = ($scriptLines -join "`n") -replace "`r`n", "`n" -replace "`r", "`n"
          $scriptContent | Set-Content -Path "reload-services.sh" -Encoding UTF8NoBOM -NoNewline
          scp -i $env:USERPROFILE\.ssh\oracle_key reload-services.sh ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/reload-services.sh
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "chmod +x /tmp/reload-services.sh && /tmp/reload-services.sh"
          Remove-Item reload-services.sh
        shell: pwsh

      - name: Wait for services to start
        run: |
          # Write bash script locally and SCP it to avoid heredoc issues
          $scriptLines = @(
            '#!/bin/bash',
            'sleep 10',
            'systemctl status kanban-proxy --no-pager',
            'systemctl status kanban-server --no-pager'
          )
          $scriptContent = ($scriptLines -join "`n") -replace "`r`n", "`n" -replace "`r", "`n"
          $scriptContent | Set-Content -Path "wait-services.sh" -Encoding UTF8NoBOM -NoNewline
          scp -i $env:USERPROFILE\.ssh\oracle_key wait-services.sh ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/wait-services.sh
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "chmod +x /tmp/wait-services.sh && /tmp/wait-services.sh"
          Remove-Item wait-services.sh
        shell: pwsh

      - name: Check service status
        run: |
          # Write bash script locally and SCP it to avoid heredoc issues
          $scriptLines = @(
            '#!/bin/bash',
            'echo === kanban-proxy status ===',
            'systemctl status kanban-proxy --no-pager -l',
            'echo',
            'echo === kanban-server status ===',
            'systemctl status kanban-server --no-pager -l',
            'echo',
            'echo === Port status ===',
            'ss -tlnp | grep -E ":3484|:3485"',
            'echo',
            'echo === Tailscale status ===',
            'tailscale status 2>/dev/null || echo Tailscale not running'
          )
          $scriptContent = ($scriptLines -join "`n") -replace "`r`n", "`n" -replace "`r", "`n"
          $scriptContent | Set-Content -Path "check-status.sh" -Encoding UTF8NoBOM -NoNewline
          scp -i $env:USERPROFILE\.ssh\oracle_key check-status.sh ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/check-status.sh
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "chmod +x /tmp/check-status.sh && /tmp/check-status.sh"
          Remove-Item check-status.sh
        shell: pwsh

      - name: Verify services are listening locally on Oracle
        run: |
          # Write bash script locally and SCP it to avoid heredoc issues
          $scriptLines = @(
            '#!/bin/bash',
            'echo "=== Verifying local port bindings ==="',
            'ss -tlnp | grep -E ":3484|:3485"',
            'echo',
            'echo "=== Testing local connectivity to proxy (port 3484) ==="',
            'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3484 --max-time 5 || echo "Failed to connect to proxy locally"',
            'echo',
            'echo "=== Testing local connectivity to server (port 3485) ==="',
            'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3485 --max-time 5 || echo "Failed to connect to server locally"',
            'echo',
            'echo "=== Checking process details ==="',
            'ps aux | grep -E "kanban|cline|node" | grep -v grep'
          )
          $scriptContent = ($scriptLines -join "`n") -replace "`r`n", "`n" -replace "`r", "`n"
          $scriptContent | Set-Content -Path "verify-local.sh" -Encoding UTF8NoBOM -NoNewline
          scp -i $env:USERPROFILE\.ssh\oracle_key verify-local.sh ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/verify-local.sh
          ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} "chmod +x /tmp/verify-local.sh && /tmp/verify-local.sh"
          Remove-Item verify-local.sh
        shell: pwsh

      - name: Verify deployment with HTTP health checks
        run: |
          # Test HTTP endpoints to verify Kanban is actually accessible
          $maxRetries = 5
          $retryDelay = 10
          $proxyUrl = "http://${{ env.ORACLE_HOST }}:3484"
          $serverUrl = "http://${{ env.ORACLE_HOST }}:3485"
          
          Write-Host "Testing Kanban Proxy at $proxyUrl..."
          Write-Host "Testing Kanban Server at $serverUrl..."
          
          $proxySuccess = $false
          $serverSuccess = $false
          
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Attempt $i of $maxRetries..."
            
            # Test proxy
            if (-not $proxySuccess) {
              try {
                $response = Invoke-WebRequest -Uri $proxyUrl -Method GET -TimeoutSec 10 -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  Write-Host "✓ Kanban Proxy responded with HTTP 200"
                  $proxySuccess = $true
                } else {
                  Write-Host "✗ Kanban Proxy returned HTTP $($response.StatusCode)"
                }
              } catch {
                Write-Host "✗ Kanban Proxy connection failed: $($_.Exception.Message)"
              }
            }
            
            # Test server
            if (-not $serverSuccess) {
              try {
                $response = Invoke-WebRequest -Uri $serverUrl -Method GET -TimeoutSec 10 -UseBasicParsing
                if ($response.StatusCode -eq 200) {
                  Write-Host "✓ Kanban Server responded with HTTP 200"
                  $serverSuccess = $true
                } else {
                  Write-Host "✗ Kanban Server returned HTTP $($response.StatusCode)"
                }
              } catch {
                Write-Host "✗ Kanban Server connection failed: $($_.Exception.Message)"
              }
            }
            
            if ($proxySuccess -and $serverSuccess) {
              Write-Host "✓ Both services are healthy!"
              break
            }
            
            if ($i -lt $maxRetries) {
              Write-Host "Waiting $retryDelay seconds before retry..."
              Start-Sleep -Seconds $retryDelay
            }
          }
          
          # Final verification
          if (-not $proxySuccess) {
            Write-Error "FAILED: Kanban Proxy (port 3484) did not respond successfully after $maxRetries attempts"
            exit 1
          }
          
          if (-not $serverSuccess) {
            Write-Error "FAILED: Kanban Server (port 3485) did not respond successfully after $maxRetries attempts"
            exit 1
          }
          
          Write-Host "✓ Deployment verification PASSED - Both services are accessible!"
        shell: pwsh

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ github.event.inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Oracle Host | ${{ env.ORACLE_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Path | ${{ env.DEPLOY_PATH }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed At | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- kanban-proxy.service (port 3484 - header rewriting proxy)" >> $GITHUB_STEP_SUMMARY
          echo "- kanban-server.service (port 3485 - Kanban app)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Get Tailscale IP if available, otherwise use direct IP
          $tailscaleIp = ssh -i $env:USERPROFILE\.ssh\oracle_key ${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }} 'tailscale ip -4 2>/dev/null || echo ""'
          if ($tailscaleIp) {
            echo "- **Kanban Proxy (Tailscale)**: http://$tailscaleIp:3484" >> $GITHUB_STEP_SUMMARY
          } else {
            echo "- **Kanban Proxy (Direct)**: http://${{ env.ORACLE_HOST }}:3484" >> $GITHUB_STEP_SUMMARY
          }
          echo "- **Kanban Server (Direct)**: http://${{ env.ORACLE_HOST }}:3485" >> $GITHUB_STEP_SUMMARY
        shell: pwsh
