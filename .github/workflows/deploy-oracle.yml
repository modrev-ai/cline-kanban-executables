name: Deploy to Oracle Compute

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: choice
        options:
          - production
        default: 'production'
      force:
        description: 'Force deployment even if no changes'
        type: boolean
        default: false
        required: false

jobs:
  validate-yaml:
    name: Validate YAML Syntax
    uses: ./.github/workflows/validate-yaml.yml

  build-package:
    name: Build and Package Artifacts
    needs: validate-yaml
    uses: ./.github/workflows/build-package.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      force: ${{ github.event.inputs.force }}
    secrets: inherit

  auth-setup:
    name: OCI Authentication and Environment Setup
    needs: validate-yaml
    uses: ./.github/workflows/auth-setup.yml
    with:
      environment: ${{ github.event.inputs.environment }}
    secrets:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

  deploy-to-oci:
    name: Deploy to Oracle Compute
    needs: [build-package, auth-setup]
    uses: ./.github/workflows/deploy-to-oci.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      ssh-key-path: ${{ needs.auth-setup.outputs.ssh-key-path }}
      known-hosts-path: ${{ needs.auth-setup.outputs.known-hosts-path }}
      artifact-name: 'deployment-artifacts'
    secrets:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      GH_PAT: ${{ secrets.GH_PAT }}

  health-check:
    name: Post-Deployment Health Check
    needs: deploy-to-oci
    uses: ./.github/workflows/health-check.yml
    with:
      environment: ${{ github.event.inputs.environment }}
      ssh-key-path: ${{ needs.auth-setup.outputs.ssh-key-path }}
      known-hosts-path: ${{ needs.auth-setup.outputs.known-hosts-path }}
    secrets:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}