name: Deploy Infrastructure to Oracle Compute

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
    secrets:
      ORACLE_HOST:
        description: 'Oracle Compute instance public IP or hostname'
        required: true
      ORACLE_USER:
        description: 'SSH username for Oracle instance (typically opc)'
        required: true
      ORACLE_SSH_KEY_B64:
        description: 'Base64-encoded SSH private key for Oracle instance'
        required: true
      DEPLOY_PATH:
        description: 'Remote deployment path on Oracle instance'
        required: true
      GH_PAT:
        description: 'GitHub Personal Access Token for private repo access'
        required: false

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure to OCI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          
          # Decode base64 SSH key - remove any whitespace/newlines from secret
          key="${ORACLE_SSH_KEY}"
          key=$(echo "$key" | tr -d '[:space:]')
          
          echo "$key" | base64 -d > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          
          # Add host to known_hosts
          echo "Running ssh-keyscan for ${{ env.ORACLE_HOST }}..."
          ssh-keyscan -H -T 30 "${{ env.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: ssh-keyscan timed out or failed, will use StrictHostKeyChecking=no"
          
          echo "SSH key setup successful"
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}
      - name: Setup SSH key permissions
        run: |
          chmod 600 ~/.ssh/oracle_key
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/oracle_key -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "echo 'SSH connection successful'"

      - name: Install system packages and Node.js on Oracle
        run: |
          cat > /tmp/install-infra.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Installing system packages ==="
          # Run dnf update in background with nohup to prevent SSH timeout
          nohup sudo dnf update -y > /tmp/dnf-update.log 2>&1 &
          UPDATE_PID=$!
          echo "dnf update started in background (PID: $UPDATE_PID)"
          
          # Wait for update to complete with progress indication
          while kill -0 $UPDATE_PID 2>/dev/null; do
            echo "Waiting for dnf update to complete... (check /tmp/dnf-update.log for progress)"
            sleep 30
          done
          wait $UPDATE_PID
          echo "dnf update completed"
          
          sudo dnf install -y git curl wget firewalld
          
          echo "=== Configuring swap (4GB) ==="
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab
          else
            CURRENT_SIZE=$(stat -c%s /swapfile 2>/dev/null || echo 0)
            if [ "$CURRENT_SIZE" -lt 4294967296 ]; then
              sudo swapoff /swapfile
              sudo fallocate -l 4G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
          fi
          
          echo "=== Installing Node.js 22 ==="
          if ! command -v node &> /dev/null; then
            NODE_VERSION="22.14.0"
            ARCH="linux-x64"
            cd /tmp
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-${ARCH}.tar.xz" -o node.tar.xz
            tar -xf node.tar.xz
            sudo cp -r node-v${NODE_VERSION}-${ARCH}/bin/* /usr/local/bin/
            sudo cp -r node-v${NODE_VERSION}-${ARCH}/lib/* /usr/local/lib/
            sudo cp -r node-v${NODE_VERSION}-${ARCH}/include/* /usr/local/include/
            sudo cp -r node-v${NODE_VERSION}-${ARCH}/share/* /usr/local/share/
            rm -rf node-v${NODE_VERSION}-${ARCH} node.tar.xz
          fi
          
          echo "=== Creating symlinks ==="
          sudo ln -sf /usr/local/bin/node /usr/bin/node
          sudo ln -sf /usr/local/bin/npm /usr/bin/npm
          
          echo "=== Configuring npm for low memory ==="
          sudo /usr/local/bin/npm config set prefer-offline true
          sudo /usr/local/bin/npm config set audit false
          sudo /usr/local/bin/npm config set fund false
          sudo /usr/local/bin/npm config set maxsockets 1
          
          echo "=== Configuring git ==="
          sudo git config --global url."https://github.com/".insteadOf "git@github.com:"
          sudo git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          
          echo "=== Installing global npm packages ==="
          sudo /usr/local/bin/npm install -g http-proxy --omit=optional --maxsockets=1 2>&1
          
          echo "=== Installing cline from modrev-ai/cline ==="
          CLINE_VERSION=$(python3 -c "import urllib.request, json; data = json.load(urllib.request.urlopen('https://api.github.com/repos/modrev-ai/cline/releases/latest')); print(data['tag_name'])")
          echo "Latest cline version: $CLINE_VERSION"
          sudo /usr/local/bin/npm install -g "https://github.com/modrev-ai/cline/archive/refs/tags/${CLINE_VERSION}.tar.gz" --omit=optional --maxsockets=1 2>&1
          
          echo "=== Creating cline symlink ==="
          sudo ln -sf /usr/local/bin/cline /usr/bin/cline
          
          echo "=== Verifying installation ==="
          /usr/local/bin/node --version
          /usr/local/bin/npm --version
          /usr/local/bin/cline --version || (echo "cline not found, checking npm global bin:" && ls -la /usr/local/bin/ | grep cline || true)
          
          echo "=== Infrastructure installation complete ==="
          EOF
          
          chmod +x /tmp/install-infra.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 /tmp/install-infra.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/install-infra.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x /tmp/install-infra.sh && /tmp/install-infra.sh"
          rm /tmp/install-infra.sh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Configure firewall on Oracle
        run: |
          cat > /tmp/configure-firewall.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Configuring firewalld ==="
          if systemctl is-active --quiet firewalld; then
            sudo firewall-cmd --permanent --add-port=3484/tcp
            sudo firewall-cmd --permanent --add-port=3485/tcp
            sudo firewall-cmd --reload
            echo "firewalld configured successfully"
          else
            echo "firewalld not running, starting and enabling..."
            sudo systemctl enable --now firewalld
            sudo firewall-cmd --permanent --add-port=3484/tcp
            sudo firewall-cmd --permanent --add-port=3485/tcp
            sudo firewall-cmd --reload
            echo "firewalld started and configured"
          fi
          
          echo "=== Configuring iptables as fallback ==="
          sudo iptables -I INPUT -p tcp --dport 3484 -j ACCEPT 2>/dev/null || true
          sudo iptables -I INPUT -p tcp --dport 3485 -j ACCEPT 2>/dev/null || true
          
          echo "=== Saving iptables rules ==="
          sudo mkdir -p /etc/iptables
          sudo iptables-save | sudo tee /etc/iptables/rules.v4 >/dev/null 2>&1 || true
          
          echo "=== Verifying ports are open ==="
          sudo iptables -L INPUT -n | grep -E "3484|3485" || echo "No iptables rules found for ports 3484/3485"
          sudo firewall-cmd --list-ports | grep -E "3484|3485" || echo "No firewalld ports found"
          
          echo "=== Firewall configuration complete ==="
          EOF
          
          chmod +x /tmp/configure-firewall.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/configure-firewall.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/configure-firewall.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x /tmp/configure-firewall.sh && /tmp/configure-firewall.sh"
          rm /tmp/configure-firewall.sh

      - name: Create systemd service files on Oracle
        run: |
          cat > /tmp/create-services.sh << 'REMOTE_EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Creating kanban-proxy service ==="
          sudo tee /etc/systemd/system/kanban-proxy.service > /dev/null << SVC_EOF
          [Unit]
          Description=Kanban Header Rewriting Proxy
          After=network.target
          
          [Service]
          Type=simple
          User=${ORACLE_USER}
          WorkingDirectory=${DEPLOY_PATH}/prod_executable
          Environment=NODE_PATH=/home/${ORACLE_USER}/.npm-global/lib/node_modules:/usr/local/lib/node_modules
          ExecStart=/usr/bin/node kanban-proxy.js
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target
          SVC_EOF
          
          echo "=== Creating kanban-server service ==="
          sudo tee /etc/systemd/system/kanban-server.service > /dev/null << SVC_EOF
          [Unit]
          Description=Kanban Server (Cline)
          After=network.target
          
          [Service]
          Type=simple
          User=${ORACLE_USER}
          WorkingDirectory=${DEPLOY_PATH}
          Environment=KANBAN_RUNTIME_HOST=0.0.0.0
          Environment=KANBAN_RUNTIME_PORT=3485
          Environment=NODE_ENV=production
          ExecStart=/usr/bin/cline kanban
          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target
          SVC_EOF
          
          echo "=== Fixing SELinux context for service files ==="
          sudo restorecon -v /etc/systemd/system/kanban-proxy.service /etc/systemd/system/kanban-server.service
          
          echo "=== Reloading systemd ==="
          sudo systemctl daemon-reload
          
          echo "=== Verifying unit files syntax ==="
          sudo systemd-analyze verify /etc/systemd/system/kanban-proxy.service
          sudo systemd-analyze verify /etc/systemd/system/kanban-server.service
          
          echo "=== Verifying unit files loaded ==="
          systemctl list-unit-files | grep -E "kanban-proxy|kanban-server" || (echo "ERROR: Unit files not found after daemon-reload" && exit 1)
          
          echo "=== Service files created successfully ==="
          cat /etc/systemd/system/kanban-proxy.service
          cat /etc/systemd/system/kanban-server.service
          REMOTE_EOF
          
          chmod +x /tmp/create-services.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/create-services.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/create-services.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "export DEPLOY_PATH='${{ env.DEPLOY_PATH }}' ORACLE_USER='${{ env.ORACLE_USER }}' && chmod +x /tmp/create-services.sh && /tmp/create-services.sh"
          rm /tmp/create-services.sh

      - name: Debug service files
        run: |
          cat > /tmp/debug-services.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Checking service file syntax ==="
          sudo systemd-analyze verify /etc/systemd/system/kanban-proxy.service 2>&1 || true
          sudo systemd-analyze verify /etc/systemd/system/kanban-server.service 2>&1 || true
          
          echo "=== Checking service file content ==="
          cat /etc/systemd/system/kanban-proxy.service
          cat /etc/systemd/system/kanban-server.service
          
          echo "=== Checking user exists ==="
          id "${ORACLE_USER}" 2>&1 || echo "User ${ORACLE_USER} does not exist"
          
          echo "=== Checking working directories ==="
          ls -la "${DEPLOY_PATH}" 2>&1 || echo "DEPLOY_PATH not found"
          ls -la "${DEPLOY_PATH}/prod_executable" 2>&1 || echo "prod_executable not found"
          
          echo "=== Checking node and cline ==="
          which node 2>&1 || echo "node not found"
          which cline 2>&1 || echo "cline not found"
          ls -la /usr/bin/cline 2>&1 || echo "cline symlink not found"
          
          echo "=== Checking NODE_PATH ==="
          ls -la /home/${ORACLE_USER}/.npm-global/lib/node_modules 2>&1 || echo "NODE_PATH not found"
          
          echo "=== Reloading systemd ==="
          sudo systemctl daemon-reload
          
          echo "=== Checking unit file status ==="
          systemctl list-unit-files | grep -E "kanban-proxy|kanban-server" || echo "Unit files not found"
          
          echo "=== Trying to start kanban-proxy to see error ==="
          sudo systemctl start kanban-proxy 2>&1 || true
          sleep 3
          systemctl status kanban-proxy --no-pager -l 2>&1 || true
          journalctl -u kanban-proxy --no-pager -l -n 50 2>&1 || true
          
          echo "=== Trying to start kanban-server to see error ==="
          sudo systemctl start kanban-server 2>&1 || true
          sleep 3
          systemctl status kanban-server --no-pager -l 2>&1 || true
          journalctl -u kanban-server --no-pager -l -n 50 2>&1 || true
          EOF
          
          chmod +x /tmp/debug-services.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/debug-services.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/debug-services.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "export DEPLOY_PATH='${{ env.DEPLOY_PATH }}' ORACLE_USER='${{ env.ORACLE_USER }}' && chmod +x /tmp/debug-services.sh && /tmp/debug-services.sh"
          rm /tmp/debug-services.sh

      - name: Enable and start services
        run: |
          cat > /tmp/enable-services.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Reloading systemd ==="
          sudo systemctl daemon-reload
          
          echo "=== Verifying unit files loaded ==="
          systemctl list-unit-files | grep -E "kanban-proxy|kanban-server" || (echo "ERROR: Unit files not found" && exit 1)
          
          echo "=== Enabling services ==="
          sudo systemctl enable kanban-proxy kanban-server
          
          echo "=== Starting services ==="
          sudo systemctl restart kanban-proxy kanban-server
          
          echo "=== Verifying services started ==="
          sleep 5
          systemctl is-active kanban-proxy || (echo "ERROR: kanban-proxy not active" && sudo systemctl status kanban-proxy --no-pager -l && exit 1)
          systemctl is-active kanban-server || (echo "ERROR: kanban-server not active" && sudo systemctl status kanban-server --no-pager -l && exit 1)
          
          echo "=== Services enabled and started successfully ==="
          systemctl status kanban-proxy --no-pager -l
          systemctl status kanban-server --no-pager -l
          EOF
          
          chmod +x /tmp/enable-services.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/enable-services.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/enable-services.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x /tmp/enable-services.sh && /tmp/enable-services.sh"
          rm /tmp/enable-services.sh

      - name: Verify infrastructure deployment
        run: |
          cat > /tmp/verify-infra.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Verifying Node.js and npm ==="
          node --version
          npm --version
          cline --version || echo "cline check failed"
          
          echo "=== Verifying global packages ==="
          npm list -g http-proxy --depth=0
          
          echo "=== Verifying services ==="
          systemctl is-active kanban-proxy
          systemctl is-active kanban-server
          
          echo "=== Verifying ports ==="
          ss -tlnp | grep -E ":3484|:3485"
          
          echo "=== Verifying firewall ==="
          sudo firewall-cmd --list-ports | grep -E "3484|3485"
          
          echo "=== Infrastructure verification complete ==="
          EOF
          
          chmod +x /tmp/verify-infra.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/verify-infra.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/verify-infra.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x /tmp/verify-infra.sh && /tmp/verify-infra.sh"
          rm /tmp/verify-infra.sh
