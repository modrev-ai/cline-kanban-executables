name: Build and Package Artifacts

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
      force:
        description: 'Force deployment even if no changes'
        type: boolean
        required: false
        default: false

jobs:
  build:
    name: Build and Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package artifacts
        run: |
          set -euo pipefail

          # Files that must exist and be shipped (paths relative to repo root)
          prod_files="prod_executable/cline-remote-launch.ps1 prod_executable/cline-remote-launch.sh prod_executable/kanban-proxy.js"
          root_files="start/start-all.bat start/start-all.ps1 start/start-all-with-tailscale.bat start/start-all-with-tailscale.ps1 README.md"

          # Verify all required source files exist up front
          missing=""
          for f in $prod_files $root_files; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "ERROR: Missing required files:$missing" >&2
            exit 1
          fi
          echo "All source files verified"

          # Stage the deploy tree: prod_executable/* plus the start scripts + README at the root.
          # (Layout must match what deploy-to-oci.yml expects.)
          rm -rf deploy-staging
          mkdir -p deploy-staging/prod_executable
          cp -p prod_executable/* deploy-staging/prod_executable/
          cp -p start/start-all.bat start/start-all.ps1 start/start-all-with-tailscale.bat start/start-all-with-tailscale.ps1 README.md deploy-staging/
          echo "Packaged artifacts in deploy-staging"
          find deploy-staging -type f

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-artifacts
          path: deploy-staging/
          retention-days: 1
