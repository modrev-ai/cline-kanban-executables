# Vaultwarden + Caddy (auto-HTTPS) + Google Drive backup sidecar.
# Deployed to the Oracle box by .github/workflows/deploy-vaultwarden.yml.
# All values come from the generated ./.env; secrets never live in this file.

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://${VW_DOMAIN}"
      # First deploy sets this true so you can register; re-run with it false to lock down.
      SIGNUPS_ALLOWED: "${SIGNUPS_ALLOWED:-false}"
      INVITATIONS_ALLOWED: "true"
      WEBSOCKET_ENABLED: "true"
      IP_HEADER: "X-Forwarded-For"
      ROCKET_PORT: "80"
      LOG_LEVEL: "warn"
      # Admin page intentionally left disabled (no ADMIN_TOKEN).
    volumes:
      - ./data/vw-data:/data:z
    networks: [vaultwarden-net]
    # Never published to the host — only Caddy is public.

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    depends_on: [vaultwarden]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      VW_DOMAIN: "${VW_DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data       # issued certs — persisted
      - caddy-config:/config
    networks: [vaultwarden-net]

  # Enabled only when the deploy runs with `--profile backup`
  # (i.e. rclone.conf + BACKUP_ZIP_PASSWORD are present).
  backup:
    image: ttionya/vaultwarden-backup:latest
    container_name: vaultwarden-backup
    restart: unless-stopped
    profiles: ["backup"]
    depends_on: [vaultwarden]
    environment:
      RCLONE_REMOTE_NAME: "${RCLONE_REMOTE_NAME}"
      RCLONE_REMOTE_DIR: "${RCLONE_REMOTE_DIR:-VaultwardenBackup/}"
      CRON: "${BACKUP_CRON:-5 3 * * *}"
      TIMEZONE: "${TZ:-UTC}"
      ZIP_ENABLE: "TRUE"
      ZIP_TYPE: "zip"
      ZIP_PASSWORD: "${BACKUP_ZIP_PASSWORD}"
      BACKUP_KEEP_DAYS: "${BACKUP_KEEP_DAYS:-30}"
      BACKUP_FILE_DATE: "%Y%m%d_%H%M%S"
    volumes:
      - ./rclone.conf:/config/rclone/rclone.conf:ro,z
      - ./data/vw-data:/bitwarden/data/:ro,z
    networks: [vaultwarden-net]

networks:
  vaultwarden-net:
    driver: bridge

volumes:
  caddy-data:
  caddy-config:
