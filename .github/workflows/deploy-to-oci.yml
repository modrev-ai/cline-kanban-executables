name: Deploy to Oracle Compute

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
      ssh-key-path:
        description: 'Path to SSH key on runner'
        type: string
        required: true
      known-hosts-path:
        description: 'Path to known_hosts file'
        type: string
        required: true
      artifact-name:
        description: 'Name of the artifact to download'
        type: string
        required: false
        default: 'deployment-artifacts'
    secrets:
      ORACLE_HOST:
        description: 'Oracle Compute instance public IP or hostname'
        required: true
      ORACLE_USER:
        description: 'SSH username for Oracle instance (typically opc)'
        required: true
      DEPLOY_PATH:
        description: 'Remote deployment path on Oracle instance'
        required: true
      GH_PAT:
        description: 'GitHub Personal Access Token for private repo access'
        required: false

jobs:
  deploy:
    name: Deploy Files to OCI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      SSH_KEY_PATH: ${{ inputs.ssh-key-path }}
      KNOWN_HOSTS_PATH: ${{ inputs.known-hosts-path }}
    steps:
      - name: Setup SSH key permissions
        run: |
          chmod 600 "${{ env.SSH_KEY_PATH }}"
          chmod 644 "${{ env.KNOWN_HOSTS_PATH }}"

      - name: Test SSH connection
        run: |
          ssh -i "${{ env.SSH_KEY_PATH }}" -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "echo 'SSH connection successful'"

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: deploy-staging

      - name: Deploy prod_executable files via SCP
        run: |
          scp -i "${{ env.SSH_KEY_PATH }}" -o UserKnownHostsFile="${{ env.KNOWN_HOSTS_PATH }}" -r deploy-staging/prod_executable/* "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:${{ env.DEPLOY_PATH }}/prod_executable/"
          ssh -i "${{ env.SSH_KEY_PATH }}" -o UserKnownHostsFile="${{ env.KNOWN_HOSTS_PATH }}" "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x ${{ env.DEPLOY_PATH }}/prod_executable/cline-remote-launch.sh"

      - name: Deploy start scripts via SCP
        run: |
          scp -i "${{ env.SSH_KEY_PATH }}" -o UserKnownHostsFile="${{ env.KNOWN_HOSTS_PATH }}" deploy-staging/start-all.bat deploy-staging/start-all.ps1 deploy-staging/start-all-with-tailscale.bat deploy-staging/start-all-with-tailscale.ps1 "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Deploy README
        run: |
          scp -i "${{ env.SSH_KEY_PATH }}" -o UserKnownHostsFile="${{ env.KNOWN_HOSTS_PATH }}" deploy-staging/README.md "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Restart services after deployment
        run: |
          cat > /tmp/restart-services.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Restarting services after deployment ==="
          sudo systemctl daemon-reload
          sudo systemctl restart kanban-proxy kanban-server
          
          echo "=== Verifying services restarted ==="
          sleep 5
          systemctl is-active kanban-proxy || (echo "ERROR: kanban-proxy not active" && sudo systemctl status kanban-proxy --no-pager -l && exit 1)
          systemctl is-active kanban-server || (echo "ERROR: kanban-server not active" && sudo systemctl status kanban-server --no-pager -l && exit 1)
          
          echo "=== Services restarted successfully ==="
          systemctl status kanban-proxy --no-pager -l
          systemctl status kanban-server --no-pager -l
          EOF
          
          chmod +x /tmp/restart-services.sh
          scp -i "${{ env.SSH_KEY_PATH }}" -o UserKnownHostsFile="${{ env.KNOWN_HOSTS_PATH }}" /tmp/restart-services.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/restart-services.sh"
          ssh -i "${{ env.SSH_KEY_PATH }}" -o UserKnownHostsFile="${{ env.KNOWN_HOSTS_PATH }}" "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x /tmp/restart-services.sh && /tmp/restart-services.sh"
          rm /tmp/restart-services.sh