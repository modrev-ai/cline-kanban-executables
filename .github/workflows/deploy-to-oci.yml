name: Deploy to Oracle Compute

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
      artifact-name:
        description: 'Name of the artifact to download'
        type: string
        required: false
        default: 'deployment-artifacts'
      deploy-infrastructure:
        description: 'Whether infrastructure was deployed (services exist)'
        type: boolean
        required: false
        default: true
    secrets:
      ORACLE_HOST:
        description: 'Oracle Compute instance public IP or hostname'
        required: true
      ORACLE_USER:
        description: 'SSH username for Oracle instance (typically opc)'
        required: true
      DEPLOY_PATH:
        description: 'Remote deployment path on Oracle instance'
        required: true
      ORACLE_SSH_KEY_B64:
        description: 'Base64-encoded SSH private key for Oracle instance'
        required: true
      GH_PAT:
        description: 'GitHub Personal Access Token for private repo access'
        required: false

jobs:
  deploy:
    name: Deploy Files to OCI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}
      DEPLOY_INFRASTRUCTURE: ${{ inputs.deploy-infrastructure }}
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          
          # Decode base64 SSH key - remove any whitespace/newlines from secret
          key="${ORACLE_SSH_KEY}"
          key=$(echo "$key" | tr -d '[:space:]')
          
          echo "$key" | base64 -d > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          
          # Add host to known_hosts
          echo "Running ssh-keyscan for ${{ env.ORACLE_HOST }}..."
          ssh-keyscan -H -T 10 "${{ env.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: ssh-keyscan timed out or failed, will use StrictHostKeyChecking=no"
          
          chmod 644 ~/.ssh/known_hosts
          echo "SSH key setup successful"
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/oracle_key -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "echo 'SSH connection successful'"

      - name: Download deployment artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: deploy-staging

      - name: Deploy all files via SCP (single transfer)
        run: |
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -r deploy-staging/prod_executable "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:${{ env.DEPLOY_PATH }}/"
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts deploy-staging/start-all.bat deploy-staging/start-all.ps1 deploy-staging/start-all-with-tailscale.bat deploy-staging/start-all-with-tailscale.ps1 deploy-staging/README.md "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:${{ env.DEPLOY_PATH }}/"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x ${{ env.DEPLOY_PATH }}/prod_executable/cline-remote-launch.sh"

      - name: Restart services after deployment
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" '
            set -euo pipefail
            echo "=== Restarting services after deployment ==="
            sudo systemctl daemon-reload
            
            # Check if services exist
            if systemctl list-unit-files | grep -q "kanban-proxy.service"; then
              echo "Services exist, restarting..."
              sudo systemctl restart kanban-proxy kanban-server
            else
              echo "Services don't exist, enabling and starting..."
              sudo systemctl enable kanban-proxy kanban-server
              sudo systemctl start kanban-proxy kanban-server
            fi
            
            echo "=== Verifying services restarted ==="
            maxRetries=5
            retryDelay=3
            
            for i in $(seq 1 $maxRetries); do
              echo "Attempt $i of $maxRetries: Checking service status..."
              
              proxyActive=false
              serverActive=false
              proxyHttpReady=false
              serverHttpReady=false
              
              if systemctl is-active --quiet kanban-proxy; then
                proxyActive=true
              fi
              
              if systemctl is-active --quiet kanban-server; then
                serverActive=true
              fi
              
              # Also verify HTTP connectivity
              if [ "$proxyActive" = true ]; then
                if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3484 --max-time 3 2>/dev/null | grep -q "200"; then
                  proxyHttpReady=true
                fi
              fi
              
              if [ "$serverActive" = true ]; then
                if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3485 --max-time 3 2>/dev/null | grep -q "200"; then
                  serverHttpReady=true
                fi
              fi
              
              if [ "$proxyActive" = true ] && [ "$serverActive" = true ] && [ "$proxyHttpReady" = true ] && [ "$serverHttpReady" = true ]; then
                echo "=== Both services are active and HTTP-ready ==="
                break
              fi
              
              if [ $i -lt $maxRetries ]; then
                echo "Services not ready yet. Waiting $retryDelay seconds before retry..."
                sleep $retryDelay
              fi
            done
            
            # Final verification
            if ! systemctl is-active --quiet kanban-proxy; then
              echo "ERROR: kanban-proxy not active after $maxRetries attempts" >&2
              sudo systemctl status kanban-proxy --no-pager -l
              journalctl -u kanban-proxy --no-pager -l -n 20
              exit 1
            fi
            
            if ! systemctl is-active --quiet kanban-server; then
              echo "ERROR: kanban-server not active after $maxRetries attempts" >&2
              sudo systemctl status kanban-server --no-pager -l
              journalctl -u kanban-server --no-pager -l -n 20
              exit 1
            fi
            
            # Final HTTP verification
            if ! curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3484 --max-time 3 2>/dev/null | grep -q "200"; then
              echo "ERROR: kanban-proxy not responding to HTTP on port 3484" >&2
              exit 1
            fi
            
            if ! curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3485 --max-time 3 2>/dev/null | grep -q "200"; then
              echo "ERROR: kanban-server not responding to HTTP on port 3485" >&2
              exit 1
            fi
            
            echo "=== Services restarted successfully and HTTP-ready ==="
            systemctl status kanban-proxy --no-pager -l
            systemctl status kanban-server --no-pager -l
          '
