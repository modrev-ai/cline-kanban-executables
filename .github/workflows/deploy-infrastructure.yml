name: Deploy Infrastructure to Oracle Compute

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
      deploy-infrastructure:
        description: 'Deploy infrastructure (Node.js, services, firewall) before app deployment'
        type: boolean
        default: true
        required: false
    secrets:
      ORACLE_HOST:
        description: 'Oracle Compute instance public IP or hostname'
        required: true
      ORACLE_USER:
        description: 'SSH username for Oracle instance (typically opc)'
        required: true
      ORACLE_SSH_KEY_B64:
        description: 'Base64-encoded SSH private key for Oracle instance'
        required: true
      DEPLOY_PATH:
        description: 'Remote deployment path on Oracle instance'
        required: true
      GH_PAT:
        description: 'GitHub Personal Access Token for private repo access'
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
        default: 'production'
      deploy-infrastructure:
        description: 'Deploy infrastructure (Node.js, services, firewall) before app deployment'
        type: boolean
        default: true
        required: false

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure to OCI
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}
      DEPLOY_INFRASTRUCTURE: ${{ inputs.deploy-infrastructure }}
    steps:
      - name: Setup SSH key
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          mkdir -p ~/.ssh
          
          # Decode base64 SSH key - remove any whitespace/newlines from secret
          key="${ORACLE_SSH_KEY}"
          key=$(echo "$key" | tr -d '[:space:]')
          
          echo "$key" | base64 -d > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          
          # Add host to known_hosts
          echo "Running ssh-keyscan for ${{ env.ORACLE_HOST }}..."
          ssh-keyscan -H -T 30 "${{ env.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: ssh-keyscan timed out or failed, will use StrictHostKeyChecking=no"
          
          echo "SSH key setup successful"
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}
      - name: Setup SSH key permissions
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          chmod 600 ~/.ssh/oracle_key
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          ssh -i ~/.ssh/oracle_key -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "echo 'SSH connection successful'"

      - name: Install system packages and Node.js on Oracle
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          cat > /tmp/install-infra.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Installing system packages (minimal, no repo refresh) ==="
          # Install required packages WITHOUT --refresh to avoid slow Oracle Linux repo metadata updates
          # Use --nobest to avoid dependency issues, --skip-broken to continue on conflicts
          for i in {1..3}; do
            if sudo dnf install -y --nobest --skip-broken git curl wget firewalld; then
              break
            else
              echo "dnf install failed (attempt $i/3), waiting 10s for lock to clear..."
              sleep 10
            fi
          done
          
          echo "=== Configuring swap (4GB) ==="
          if [ ! -f /swapfile ]; then
            sudo fallocate -l 4G /swapfile
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo "/swapfile none swap sw 0 0" | sudo tee -a /etc/fstab
          else
            CURRENT_SIZE=$(stat -c%s /swapfile 2>/dev/null || echo 0)
            if [ "$CURRENT_SIZE" -lt 4294967296 ]; then
              sudo swapoff /swapfile
              sudo fallocate -l 4G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi
          fi
          
          echo "=== Installing Node.js 22 via binary download (fastest, no repo updates) ==="
          # Remove any existing nodejs to avoid conflicts
          sudo dnf remove -y nodejs npm 2>/dev/null || true
          sudo dnf module reset -y nodejs 2>/dev/null || true
          sudo dnf module disable -y nodejs 2>/dev/null || true
          
          # Download and install Node.js 22 binary directly (bypasses NodeSource repo entirely)
          NODE_VERSION="22.14.0"
          ARCH="x64"
          cd /tmp
          echo "Downloading Node.js ${NODE_VERSION} binary..."
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${ARCH}.tar.xz" -o node.tar.xz
          tar -xf node.tar.xz
          sudo rm -rf /usr/local/lib/nodejs
          sudo mkdir -p /usr/local/lib/nodejs
          sudo mv "node-v${NODE_VERSION}-linux-${ARCH}" /usr/local/lib/nodejs/node-v${NODE_VERSION}
          
          # Create symlinks
          sudo ln -sf /usr/local/lib/nodejs/node-v${NODE_VERSION}/bin/node /usr/bin/node
          sudo ln -sf /usr/local/lib/nodejs/node-v${NODE_VERSION}/bin/npm /usr/bin/npm
          sudo ln -sf /usr/local/lib/nodejs/node-v${NODE_VERSION}/bin/npx /usr/bin/npx
          
          # Verify installation
          /usr/bin/node --version
          /usr/bin/npm --version
          
          NODE_MAJOR=$(/usr/bin/node --version | sed 's/v\([0-9]*\).*/\1/')
          if [ "$NODE_MAJOR" -lt 22 ]; then
            echo "ERROR: Node.js version is $NODE_MAJOR, but version 22 or higher is required"
            exit 1
          fi
          echo "Node.js version $NODE_MAJOR meets requirement (>= 22)"
          
          echo "=== Configuring npm for low memory ==="
          sudo npm config set prefer-offline true
          sudo npm config set audit false
          sudo npm config set fund false
          sudo npm config set maxsockets 1
          
          echo "=== Configuring git ==="
          sudo git config --global url."https://github.com/".insteadOf "git@github.com:"
          sudo git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          
          echo "=== Installing global npm packages for ORACLE_USER ==="
          # Install http-proxy as ORACLE_USER (not root) so it's in user's global node_modules
          sudo -u "${ORACLE_USER}" bash -c 'npm config set prefix ~/.npm-global && npm install -g http-proxy --omit=optional --maxsockets=1' 2>&1
          
          echo "=== Installing cline from modrev-ai/cline ==="
          CLINE_VERSION=$(python3 -c "import urllib.request, json; data = json.load(urllib.request.urlopen('https://api.github.com/repos/modrev-ai/cline/releases/latest')); print(data['tag_name'])")
          echo "Latest cline version: $CLINE_VERSION"
          sudo npm install -g "https://github.com/modrev-ai/cline/archive/refs/tags/${CLINE_VERSION}.tar.gz" --omit=optional --maxsockets=1 2>&1
          
          echo "=== Creating cline symlink ==="
          sudo ln -sf $(which cline) /usr/bin/cline
          
          echo "=== Verifying installation ==="
          node --version
          npm --version
          cline --version || (echo "cline not found, checking npm global bin:" && ls -la /usr/local/bin/ | grep cline || true)
          
          echo "=== Infrastructure installation complete ==="
          EOF
          
          chmod +x /tmp/install-infra.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 /tmp/install-infra.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/install-infra.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "export ORACLE_USER='${{ env.ORACLE_USER }}' && chmod +x /tmp/install-infra.sh && /tmp/install-infra.sh"
          rm /tmp/install-infra.sh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Configure firewall on Oracle
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          cat > /tmp/configure-firewall.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Configuring firewalld ==="
          # Check if firewalld is installed
          if ! command -v firewall-cmd &> /dev/null; then
            echo "firewall-cmd not found, installing firewalld..."
            sudo dnf install -y firewalld
          fi
          
          # Start and enable firewalld if not running
          if ! systemctl is-active --quiet firewalld; then
            echo "firewalld not running, starting and enabling..."
            sudo systemctl enable --now firewalld
            # Wait for firewalld to be ready
            sleep 3
          fi
          
          # Add ports to firewalld (with retries)
          for port in 3484 3485; do
            for i in {1..3}; do
              if sudo firewall-cmd --permanent --add-port=${port}/tcp 2>/dev/null; then
                echo "Added port ${port}/tcp to firewalld (permanent)"
                break
              else
                echo "Attempt $i: Failed to add port ${port}/tcp, retrying..."
                sleep 2
              fi
            done
          done
          
          # Reload firewalld
          for i in {1..3}; do
            if sudo firewall-cmd --reload 2>/dev/null; then
              echo "firewalld reloaded successfully"
              break
            else
              echo "Attempt $i: Failed to reload firewalld, retrying..."
              sleep 2
            fi
          done
          
          echo "=== Configuring iptables as fallback ==="
          sudo iptables -I INPUT -p tcp --dport 3484 -j ACCEPT 2>/dev/null || true
          sudo iptables -I INPUT -p tcp --dport 3485 -j ACCEPT 2>/dev/null || true
          
          echo "=== Saving iptables rules ==="
          sudo mkdir -p /etc/iptables
          sudo iptables-save | sudo tee /etc/iptables/rules.v4 >/dev/null 2>&1 || true
          
          echo "=== Verifying ports are open ==="
          sudo iptables -L INPUT -n | grep -E "3484|3485" || echo "No iptables rules found for ports 3484/3485"
          sudo firewall-cmd --list-ports 2>/dev/null | grep -E "3484|3485" || echo "No firewalld ports found (may need manual check)"
          
          echo "=== Firewall configuration complete ==="
          EOF
          
          chmod +x /tmp/configure-firewall.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/configure-firewall.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/configure-firewall.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x /tmp/configure-firewall.sh && /tmp/configure-firewall.sh"
          rm /tmp/configure-firewall.sh

      - name: Create systemd service files on Oracle
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          cat > /tmp/create-services.sh << 'REMOTE_EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Creating kanban-proxy service ==="
          sudo tee /etc/systemd/system/kanban-proxy.service > /dev/null << SVC_EOF
          [Unit]
          Description=Kanban Header Rewriting Proxy
          After=network.target
          
          [Service]
          Type=simple
          User=${ORACLE_USER}
          WorkingDirectory=${DEPLOY_PATH}/prod_executable
          Environment=NODE_PATH=/home/${ORACLE_USER}/.npm-global/lib/node_modules:/usr/local/lib/node_modules
          ExecStart=/usr/bin/node kanban-proxy.js
          Restart=on-failure
          RestartSec=5
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target
          SVC_EOF
          
          echo "=== Creating kanban-server service ==="
          sudo tee /etc/systemd/system/kanban-server.service > /dev/null << SVC_EOF
          [Unit]
          Description=Kanban Server (Cline)
          After=network.target
          
          [Service]
          Type=simple
          User=${ORACLE_USER}
          WorkingDirectory=${DEPLOY_PATH}
          Environment=KANBAN_RUNTIME_HOST=0.0.0.0
          Environment=KANBAN_RUNTIME_PORT=3485
          Environment=NODE_ENV=production
          ExecStart=/usr/bin/cline kanban
          Restart=on-failure
          RestartSec=10
          StandardOutput=journal
          StandardError=journal
          
          [Install]
          WantedBy=multi-user.target
          SVC_EOF
          
          echo "=== Fixing SELinux context for service files ==="
          sudo restorecon -v /etc/systemd/system/kanban-proxy.service /etc/systemd/system/kanban-server.service
          
          echo "=== Reloading systemd ==="
          sudo systemctl daemon-reload
          
          echo "=== Verifying unit files syntax ==="
          sudo systemd-analyze verify /etc/systemd/system/kanban-proxy.service
          sudo systemd-analyze verify /etc/systemd/system/kanban-server.service
          
          echo "=== Verifying unit files loaded ==="
          systemctl list-unit-files | grep -E "kanban-proxy|kanban-server" || (echo "ERROR: Unit files not found after daemon-reload" && exit 1)
          
          echo "=== Service files created successfully ==="
          cat /etc/systemd/system/kanban-proxy.service
          cat /etc/systemd/system/kanban-server.service
          REMOTE_EOF
          
          chmod +x /tmp/create-services.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/create-services.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/create-services.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "export DEPLOY_PATH='${{ env.DEPLOY_PATH }}' && export ORACLE_USER='${{ env.ORACLE_USER }}' && chmod +x /tmp/create-services.sh && /tmp/create-services.sh"
          rm /tmp/create-services.sh

      - name: Debug service files
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          cat > /tmp/debug-services.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Checking service file syntax ==="
          sudo systemd-analyze verify /etc/systemd/system/kanban-proxy.service 2>&1 || true
          sudo systemd-analyze verify /etc/systemd/system/kanban-server.service 2>&1 || true
          
          echo "=== Checking service file content ==="
          cat /etc/systemd/system/kanban-proxy.service
          cat /etc/systemd/system/kanban-server.service
          
          echo "=== Checking user exists ==="
          id "${ORACLE_USER}" 2>&1 || echo "User ${ORACLE_USER} does not exist"
          
          echo "=== Checking working directories ==="
          ls -la "${DEPLOY_PATH}" 2>&1 || echo "DEPLOY_PATH not found"
          ls -la "${DEPLOY_PATH}/prod_executable" 2>&1 || echo "prod_executable not found"
          
          echo "=== Checking node and cline ==="
          which node 2>&1 || echo "node not found"
          which cline 2>&1 || echo "cline not found"
          ls -la /usr/bin/cline 2>&1 || echo "cline symlink not found"
          
          echo "=== Checking NODE_PATH ==="
          ls -la /home/${ORACLE_USER}/.npm-global/lib/node_modules 2>&1 || echo "NODE_PATH not found"
          
          echo "=== Reloading systemd ==="
          sudo systemctl daemon-reload
          
          echo "=== Checking unit file status ==="
          systemctl list-unit-files | grep -E "kanban-proxy|kanban-server" || echo "Unit files not found"
          
          echo "=== Trying to start kanban-proxy to see error ==="
          sudo systemctl start kanban-proxy 2>&1 || true
          sleep 3
          systemctl status kanban-proxy --no-pager -l 2>&1 || true
          journalctl -u kanban-proxy --no-pager -l -n 50 2>&1 || true
          
          echo "=== Trying to start kanban-server to see error ==="
          sudo systemctl start kanban-server 2>&1 || true
          sleep 3
          systemctl status kanban-server --no-pager -l 2>&1 || true
          journalctl -u kanban-server --no-pager -l -n 50 2>&1 || true
          EOF
          
          chmod +x /tmp/debug-services.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts /tmp/debug-services.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/debug-services.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "export DEPLOY_PATH='${{ env.DEPLOY_PATH }}' && export ORACLE_USER='${{ env.ORACLE_USER }}' && chmod +x /tmp/debug-services.sh && /tmp/debug-services.sh"
          rm /tmp/debug-services.sh

      - name: Verify infrastructure deployment (packages, firewall, service files)
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          cat > /tmp/verify-infra.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          
          echo "=== Verifying Node.js and npm ==="
          node --version
          npm --version
          cline --version || echo "cline check failed"
          
          echo "=== Verifying global packages ==="
          npm list -g http-proxy --depth=0
          
          echo "=== Verifying service files exist ==="
          systemctl list-unit-files | grep -E "kanban-proxy|kanban-server" || (echo "ERROR: Unit files not found" && exit 1)
          
          echo "=== Verifying service file syntax ==="
          sudo systemd-analyze verify /etc/systemd/system/kanban-proxy.service
          sudo systemd-analyze verify /etc/systemd/system/kanban-server.service
          
          echo "=== Verifying firewall ==="
          sudo firewall-cmd --list-ports | grep -E "3484|3485"
          
          echo "=== Infrastructure verification complete (services NOT started - will be started after app deployment) ==="
          EOF
          
          chmod +x /tmp/verify-infra.sh
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 /tmp/verify-infra.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/verify-infra.sh"
          
          # Run verification with retries
          maxRetries=5
          retryDelay=10
          
          for i in $(seq 1 $maxRetries); do
            echo "Attempt $i of $maxRetries: Running infrastructure verification..."
            
            if ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o ConnectTimeout=30 "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "chmod +x /tmp/verify-infra.sh && /tmp/verify-infra.sh"; then
              echo "=== Infrastructure verification passed on attempt $i ==="
              break
            else
              echo "Attempt $i failed. Waiting $retryDelay seconds before retry..."
              if [ $i -lt $maxRetries ]; then
                sleep $retryDelay
              fi
            fi
          done
          
          # Final check
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o ConnectTimeout=30 "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "/tmp/verify-infra.sh"
          
          rm /tmp/verify-infra.sh
