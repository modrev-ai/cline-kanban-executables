name: Deploy Infrastructure to Oracle Compute

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
      deploy-infrastructure:
        description: 'Deploy infrastructure (Node.js, services, firewall) before app deployment'
        type: boolean
        default: true
        required: false
    secrets:
      ORACLE_HOST:
        description: 'Oracle Compute instance public IP or hostname'
        required: true
      ORACLE_USER:
        description: 'SSH username for Oracle instance (typically opc)'
        required: true
      ORACLE_SSH_KEY_B64:
        description: 'Base64-encoded SSH private key for Oracle instance'
        required: true
      DEPLOY_PATH:
        description: 'Remote deployment path on Oracle instance'
        required: true
      GH_PAT:
        description: 'GitHub Personal Access Token for private repo access'
        required: false
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
        default: 'production'
      deploy-infrastructure:
        description: 'Deploy infrastructure (Node.js, services, firewall) before app deployment'
        type: boolean
        default: true
        required: false

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure to OCI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}
      DEPLOY_INFRASTRUCTURE: ${{ inputs.deploy-infrastructure }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          mkdir -p ~/.ssh
          
          # Decode base64 SSH key - remove any whitespace/newlines from secret
          key="${ORACLE_SSH_KEY}"
          key=$(echo "$key" | tr -d '[:space:]')
          
          echo "$key" | base64 -d > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key
          
          # Add host to known_hosts
          echo "Running ssh-keyscan for ${{ env.ORACLE_HOST }}..."
          ssh-keyscan -H -T 10 "${{ env.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: ssh-keyscan timed out or failed, will use StrictHostKeyChecking=no"
          
          chmod 644 ~/.ssh/known_hosts
          echo "SSH key setup successful"
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}

      - name: Test SSH connection
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          ssh -i ~/.ssh/oracle_key -o ConnectTimeout=10 -o BatchMode=yes -o StrictHostKeyChecking=no "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "echo 'SSH connection successful'"

      - name: Deploy infrastructure (packages, Node.js, firewall, services) - Single SSH session
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          # Copy the deployment script to the remote server
          scp -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 deploy/scripts/deploy-infra.sh "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}:/tmp/deploy-infra.sh"
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "export ORACLE_USER='${{ env.ORACLE_USER }}' && export DEPLOY_PATH='${{ env.DEPLOY_PATH }}' && chmod +x /tmp/deploy-infra.sh && /tmp/deploy-infra.sh"
        env:
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Verify infrastructure deployment (single quick check)
        if: ${{ env.DEPLOY_INFRASTRUCTURE == 'true' }}
        run: |
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=120 -o ConnectTimeout=30 "${{ env.ORACLE_USER }}@${{ env.ORACLE_HOST }}" "export ORACLE_USER='${{ env.ORACLE_USER }}' && export DEPLOY_PATH='${{ env.DEPLOY_PATH }}' && set -euo pipefail && echo '=== Quick infrastructure verification ===' && node --version && npm --version && echo '=== Verifying cline version and source ===' && CLINE_VERSION=\$(/usr/bin/cline --version 2>/dev/null | head -1 || echo 'NOT FOUND') && echo \"cline version: \$CLINE_VERSION\" && NPM_GLOBAL_ROOT=\$(sudo -u \"\${ORACLE_USER}\" bash -c 'npm root -g 2>/dev/null' 2>/dev/null) && echo \"npm global root: \$NPM_GLOBAL_ROOT\" && NPM_GLOBAL_BIN=\$(sudo -u \"\${ORACLE_USER}\" bash -c 'npm bin -g 2>/dev/null' 2>/dev/null) && echo \"npm global bin: \$NPM_GLOBAL_BIN\" && CLINE_PKG_PATH=\"\" && if [ -n \"\$NPM_GLOBAL_ROOT\" ] && [ -f \"\${NPM_GLOBAL_ROOT}/cline/package.json\" ]; then CLINE_PKG_PATH=\"\${NPM_GLOBAL_ROOT}/cline/package.json\"; elif [ -f \"/home/\${ORACLE_USER}/.npm-global/lib/node_modules/cline/package.json\" ]; then CLINE_PKG_PATH=\"/home/\${ORACLE_USER}/.npm-global/lib/node_modules/cline/package.json\"; else CLINE_PKG_PATH=\$(sudo -u \"\${ORACLE_USER}\" bash -c 'find ~/.npm-global/lib/node_modules/cline -name package.json 2>/dev/null | head -1' 2>/dev/null); fi && if [ ! -f \"\$CLINE_PKG_PATH\" ]; then echo \"ERROR: Could not find cline package.json anywhere\" >&2 && exit 1; fi && echo \"Found cline package.json at: \$CLINE_PKG_PATH\" && CLINE_REPO=\$(grep -o '\"repository\"[[:space:]]*:[[:space:]]*\"[^\"]*\"' \"\$CLINE_PKG_PATH\" 2>/dev/null | head -1 | sed 's/.*\"repository\"[[:space:]]*:[[:space:]]*\"\([^\"]*\)\".*/\1/' || echo '') && echo \"cline repository: \$CLINE_REPO\" && if [[ ! \"\$CLINE_REPO\" =~ modrev-ai/cline ]]; then echo 'ERROR: cline is not from modrev-ai/cline!' >&2 && exit 1; fi && echo '=== Verifying cline kanban command (built into cline) ===' && /usr/bin/cline kanban --help 2>&1 | head -5 || (echo 'ERROR: cline kanban command failed' >&2 && exit 1) && echo '=== Verifying http-proxy ===' && sudo -u \"\${ORACLE_USER}\" bash -c \"npm list -g http-proxy --depth=0 2>/dev/null\" || echo 'http-proxy not in global list' && systemctl list-unit-files | grep -E 'kanban-proxy|kanban-server' || (echo 'ERROR: Unit files not found' && exit 1) && sudo systemd-analyze verify /etc/systemd/system/kanban-proxy.service && sudo systemd-analyze verify /etc/systemd/system/kanban-server.service && sudo firewall-cmd --list-ports 2>/dev/null | grep -E '3484|3485' || echo 'Firewall ports check (may need manual verification)' && echo '=== Infrastructure verification complete ==='"
