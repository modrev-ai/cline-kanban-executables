name: Post-Deployment Health Check

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment environment'
        type: string
        required: true
    secrets:
      ORACLE_HOST:
        description: 'Oracle Compute instance public IP or hostname'
        required: true
      ORACLE_USER:
        description: 'SSH username for Oracle instance (typically opc)'
        required: true
      DEPLOY_PATH:
        description: 'Remote deployment path on Oracle instance'
        required: true
      ORACLE_SSH_KEY_B64:
        description: 'Base64-encoded SSH private key for Oracle instance'
        required: true

jobs:
  health-check:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}
    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh

          # Decode base64 SSH key - remove any whitespace/newlines from secret
          key="${ORACLE_SSH_KEY}"
          key=$(echo "$key" | tr -d '[:space:]')

          echo "$key" | base64 -d > ~/.ssh/oracle_key
          chmod 600 ~/.ssh/oracle_key

          # Add host to known_hosts
          echo "Running ssh-keyscan for ${{ env.ORACLE_HOST }}..."
          ssh-keyscan -H -T 30 "${{ env.ORACLE_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || echo "Warning: ssh-keyscan timed out or failed, will use StrictHostKeyChecking=no"

          echo "SSH key setup successful"
        env:
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY_B64 }}

      - name: Check service status on Oracle
        run: |
          ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${ORACLE_USER}@${ORACLE_HOST}" bash << 'ENDSSH'
            echo "=== kanban-proxy status ==="
            systemctl status kanban-proxy --no-pager -l
            echo
            echo "=== kanban-server status ==="
            systemctl status kanban-server --no-pager -l
            echo
            echo "=== Port status ==="
            ss -tlnp | grep -E ":3484|:3485" || echo "No services on 3484/3485 yet"
            echo
            echo "=== Tailscale status ==="
            tailscale status 2>/dev/null || echo "Tailscale not running"
          ENDSSH

      - name: Verify deployment with HTTP health checks (via SSH on Oracle)
        run: |
          # Run curl directly on the Oracle instance via SSH to bypass Oracle Cloud
          # Security Group restrictions on port 3484. The kanban-server (cline kanban)
          # binds to 127.0.0.1:3485 (localhost only) and takes ~90s to init its HTTP
          # endpoint. The proxy on 3484 forwards to 3485 - a 200 from the proxy
          # confirms both services are healthy end-to-end.
          maxRetries=18
          retryDelay=20

          echo "Testing Kanban services via SSH on Oracle instance..."
          echo "Note: cline kanban takes ~90s to init - will retry for up to 6 minutes"

          proxySuccess=false

          for i in $(seq 1 $maxRetries); do
            echo "Attempt $i of $maxRetries..."

            # Run curl on the Oracle instance itself (bypasses external firewall)
            response=$(ssh -i ~/.ssh/oracle_key \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o ConnectTimeout=10 \
              "${ORACLE_USER}@${ORACLE_HOST}" \
              'curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3484 --max-time 15 2>/dev/null || echo "000"')

            echo "  Proxy (port 3484) HTTP response: $response"

            if [ "$response" = "200" ]; then
              echo "[OK] Kanban Proxy responded with HTTP 200 (backend server is ready)"
              proxySuccess=true
              break
            elif [ "$response" = "000" ]; then
              echo "[INFO] Proxy connection timed out - backend may still be initializing"
            else
              echo "[INFO] Proxy returned HTTP $response - may still be initializing"
            fi

            if [ $i -lt $maxRetries ]; then
              echo "Waiting $retryDelay seconds before retry..."
              sleep $retryDelay
            fi
          done

          # Final verification
          if [ "$proxySuccess" = false ]; then
            echo "FAILED: Kanban Proxy (port 3484) did not respond with HTTP 200 after $maxRetries attempts" >&2
            echo ""
            echo "=== Final diagnostics ==="
            ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${ORACLE_USER}@${ORACLE_HOST}" bash << 'ENDSSH' || true
              echo "--- Port bindings ---"
              ss -tlnp | grep -E "3484|3485" || echo "No bindings on 3484/3485"
              echo "--- kanban-proxy logs ---"
              journalctl -u kanban-proxy --no-pager -l -n 30
              echo "--- kanban-server logs ---"
              journalctl -u kanban-server --no-pager -l -n 30
            ENDSSH
            exit 1
          fi

          echo "[OK] Deployment verification PASSED - Kanban Proxy is accessible and backend server is ready!"

      - name: Deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Oracle Host | ${{ env.ORACLE_HOST }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Path | ${{ env.DEPLOY_PATH }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployed At | $(date -u) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- kanban-proxy.service (port 3484 - header rewriting proxy)" >> $GITHUB_STEP_SUMMARY
          echo "- kanban-server.service (port 3485 - Kanban app)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Access" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # Get Tailscale IP if available, otherwise use direct IP
          tailscaleIp=$(ssh -i ~/.ssh/oracle_key -o UserKnownHostsFile=~/.ssh/known_hosts "${ORACLE_USER}@${ORACLE_HOST}" 'tailscale ip -4 2>/dev/null || echo ""')
          if [ -n "$tailscaleIp" ]; then
            echo "- **Kanban Proxy (Tailscale)**: http://$tailscaleIp:3484" >> $GITHUB_STEP_SUMMARY
          else
            echo "- **Kanban Proxy (Direct)**: http://${ORACLE_HOST}:3484" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- **Kanban Server (Direct)**: http://${ORACLE_HOST}:3485" >> $GITHUB_STEP_SUMMARY
