"# GitHub Actions workflow for Oracle Cloud deployment" 
name: Deploy to Oracle Cloud Free Tier
 
on:
  push:
    branches: [main, feature/kanban-dashboard-antigravity-tailscale]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      oracle_host:
        description: 'Oracle Cloud instance public IP or hostname'
        required: true
        type: string
      oracle_user:
        description: 'SSH username (usually ubuntu)'
        required: false
        default: 'ubuntu'
        type: string
      ssh_key:
        description: 'SSH private key for authentication'
        required: true
        type: string
 
permissions:
  contents: read
  id-token: write
 
jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ github.event.inputs.ssh_key || secrets.ORACLE_SSH_KEY }}
 
      - name: Add known hosts
        run: |
          ssh-keyscan -H ${{ github.event.inputs.oracle_host || secrets.ORACLE_INSTANCE_HOST }} >> ~/.ssh/known_hosts
 
      - name: Deploy to Oracle Cloud
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ github.event.inputs.oracle_user || 'ubuntu' }}@${{ github.event.inputs.oracle_host || secrets.ORACLE_INSTANCE_HOST }} << 'EOF'
          log_info() { echo -e "\033[0;32m[INFO]\033[0m $1"; }
          log_warn() { echo -e "\033[1;33m[WARN]\033[0m $1"; }
          log_error() { echo -e "\033[0;31m[ERROR]\033[0m $1"; }
 
          log_info "Starting deployment..."
 
          # Update system
          log_info "Updating system..."
          sudo apt update && sudo apt upgrade -y
 
          # Install essential packages
          log_info "Installing essential packages..."
          sudo apt install -y curl wget git unzip htop nginx certbot python3-certbot-nginx build-essential python3 ufw fail2ban
 
          # Configure firewall
          log_info "Configuring firewall..."
          sudo ufw allow 22/tcp
          sudo ufw allow 80/tcp
          sudo ufw allow 443/tcp
          sudo ufw allow 41641/udp
          sudo ufw --force enable
 
          # Install Node.js 20 LTS
          log_info "Installing Node.js 20 LTS..."
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt install -y nodejs
 
          # Verify Node.js
          log_info "Node.js version: $(node --version)"
          log_info "npm version: $(npm --version)"
 
          # Install pnpm
          corepack enable
          corepack prepare pnpm@latest --activate
 
          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --ssh
          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null || echo "Not connected yet")
          log_info "Tailscale IP: $TAILSCALE_IP"
# Clone Cline Dashboard repository
          log_info "Cloning Cline Dashboard repository..."
          cd /opt
          if [ ! -d "cline-dashboard" ]; then
            sudo git clone https://github.com/modrev-ai/cline-kanban-executables.git cline-dashboard
            sudo chown -R ubuntu:ubuntu cline-dashboard
          fi
          cd cline-dashboard
 
          # Install Cline Dashboard dependencies
          log_info "Installing Cline Dashboard dependencies..."
          npm install
 
          # Initialize database
          log_info "Initializing Cline Dashboard database..."
          npm run db:init
 
          # Create Cline start script
          cat > /opt/cline-dashboard/start-cline.sh << 'EOF'
#!/bin/bash
cd /opt/cline-dashboard
export NODE_ENV=production
export PORT=3001
export HOST=0.0.0.0
export AGY_COMMAND=agy
export AGY_ARGS="run --prompt {prompt} --json-logs"
exec npm start
EOF
chmod +x /opt/cline-dashboard/start-cline.sh
 
          # Create PM2 ecosystem file
          cat > /opt/ecosystem.config.js << 'EOF'
module.exports = {
  apps: [
    {
      name: 'kanban-web',
      script: '/opt/kanban/start-kanban.sh',
      cwd: '/opt/kanban/web-ui',
      env: {
        NODE_ENV: 'production',
        PORT: 3000,
        HOST: '0.0.0.0'
      },
      instances: 1,
      autorestart: true,
      watch: false,
      max_memory_restart: '1G',
      error_file: '/var/log/pm2/kanban-error.log',
      out_file: '/var/log/pm2/kanban-out.log',
      log_date_format: 'YYYY-MM-DD HH:mm:ss Z'
    },
    {
      name: 'cline-dashboard',
      script: '/opt/cline-dashboard/start-cline.sh',
      cwd: '/opt/cline-dashboard',
      env: {
        NODE_ENV: 'production',
        PORT: 3001,
        HOST: '0.0.0.0',
        AGY_COMMAND: 'agy',
        AGY_ARGS: 'run --prompt {prompt} --json-logs'
      },
      instances: 1,
      autorestart: true,
      watch: false,
      max_memory_restart: '1G',
      error_file: '/var/log/pm2/cline-error.log',
      out_file: '/var/log/pm2/cline-out.log',
      log_date_format: 'YYYY-MM-DD HH:mm:ss Z'
    }
  ]
};
EOF
 
          # Start applications with PM2
          log_info "Starting applications with PM2..."
          pm2 start /opt/ecosystem.config.js
 
          # Save PM2 configuration
          pm2 save
 
          # Setup PM2 startup
          STARTUP_CMD=$(pm2 startup systemd -u ubuntu --hp /home/ubuntu | tail -1)
          if [[ $STARTUP_CMD == sudo* ]]; then
            eval $STARTUP_CMD
          fi
 
          log_info "Deployment complete! Check status with: pm2 status"
 
          # Verify deployment
          curl -sf http://localhost:3000 >/dev/null && echo "Kanban OK" || echo "Kanban FAILED"
          curl -sf http://localhost:3001/api/health >/dev/null && echo "Cline OK" || echo "Cline FAILED"
 
          # Show Tailscale IP
          TAILSCALE_IP=$(tailscale ip -4 2>/dev/null || echo "Not connected")
          echo ""
          echo "=========================================="
          echo "Deployment Complete!"
          echo "=========================================="
- name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ env.ORACLE_INSTANCE_USER }}@${{ env.ORACLE_INSTANCE_HOST }} \
            "curl -sf http://localhost:3000 >/dev/null && echo 'Kanban OK' || echo 'Kanban FAILED'; \
             curl -sf http://localhost:3001/api/health >/dev/null && echo 'Cline OK' || echo 'Cline FAILED'"
 
  notify:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Send notification
        if: failure()
        run: |
          echo "Deployment failed! Check GitHub Actions for details."
          # Add Slack/Discord/email notification here if desired
 
      - name: Success notification
        if: success()
        run: |
          echo "Deployment successful!"
          echo "Access via Tailscale or configured domain"
 
  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()
    steps:
      - name: Rollback
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ env.ORACLE_INSTANCE_USER }}@${{ env.ORACLE_INSTANCE_HOST }} << 'EOF'
            log_info() { echo -e "\033[0;32m[INFO]\033[0m $1"; }
            log_info "Rolling back..."
            pm2 delete all 2>/dev/null || true
            pm2 start /opt/ecosystem.config.js 2>/dev/null || true
            log_info "Rollback complete"
            pm2 status
          EOF
          echo "Kanban: http://$(hostname -I | awk '{print $1}'):3000"
          echo "Cline:  http://$(hostname -I | awk '{print $1}'):3001"
          echo "Tailscale: ${TAILSCALE_IP}:3000 (Kanban) / ${TAILSCALE_IP}:3001 (Cline)"
          echo "=========================================="
          EOF
 
          # Install PM2
          sudo npm install -g pm2
 
          # Create log directory
          sudo mkdir -p /var/log/pm2
          sudo chown -R ubuntu:ubuntu /var/log/pm2
 
          # Clone Kanban repository
          log_info "Cloning Kanban repository..."
          cd /opt
          if [ ! -d "kanban" ]; then
            sudo git clone https://github.com/modrev-ai/kanban.git
            sudo chown -R ubuntu:ubuntu kanban
          fi
          cd kanban
 
          # Install Kanban dependencies
          log_info "Installing Kanban dependencies..."
          pnpm install --frozen-lockfile
 
          # Build Kanban
          log_info "Building Kanban..."
          pnpm run build
 
          # Build web-ui specifically
          cd web-ui
          pnpm run build
 
          # Create Kanban start script
          cat > /opt/kanban/start-kanban.sh << 'EOF'
#!/bin/bash
cd /opt/kanban/web-ui
export NODE_ENV=production
export PORT=3000
exec pnpm preview --host 0.0.0.0 --port 3000
EOF
chmod +x /opt/kanban/start-kanban.sh